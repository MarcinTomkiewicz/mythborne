name: Deploy Mythsworn

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "test"
        type: choice
        options:
          - test
          - prod

  push:
    branches:
      - develop

concurrency:
  group: mythsworn-${{ github.ref_name }}-${{ github.event.inputs.environment || 'auto' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-target:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.target.outputs.target }}
      port: ${{ steps.target.outputs.port }}
    steps:
      - id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            TARGET="test"
          elif [ "${{ github.ref_name }}" = "master" ]; then
            TARGET="prod"
          else
            echo "Unsupported branch: ${{ github.ref_name }}"
            exit 1
          fi

          case "$TARGET" in
            test)
              PORT="4110"
              ;;
            prod)
              PORT="4120"
              ;;
            *)
              echo "Unsupported target: $TARGET"
              exit 1
              ;;
          esac

          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "port=$PORT" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: resolve-target
    environment:
      name: mythsworn-${{ needs.resolve-target.outputs.target }}

    steps:
      - name: Workflow version marker
        shell: bash
        run: |
          echo "Deploy Mythsworn workflow version: 2026-05-11-develop-auto-test"
          echo "Event: ${{ github.event_name }}"
          echo "Branch/ref: ${{ github.ref_name }}"
          echo "Target: ${{ needs.resolve-target.outputs.target }}"
          echo "Port: ${{ needs.resolve-target.outputs.port }}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Angular environment
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "Missing SUPABASE_URL secret for environment mythsworn-${{ needs.resolve-target.outputs.target }}"
            exit 1
          fi

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_ANON_KEY secret for environment mythsworn-${{ needs.resolve-target.outputs.target }}"
            exit 1
          fi

          node <<'NODE'
          const fs = require('node:fs');

          const supabaseUrl = process.env.SUPABASE_URL;
          const supabaseKey = process.env.SUPABASE_ANON_KEY;

          const outputPath = 'src/environments/environment.ts';

          const content =
            `export const environment = ${JSON.stringify(
              {
                production: true,
                supabaseUrl,
                supabaseKey,
              },
              null,
              2,
            )};\n`;

          fs.mkdirSync('src/environments', { recursive: true });
          fs.writeFileSync(outputPath, content, 'utf8');

          console.log(`Generated ${outputPath}`);
          NODE

      - name: Build SSR
        run: npm run build:ssr
        env:
          APP_BASE_HREF: "/"

      - name: Verify dist
        shell: bash
        run: |
          test -d dist/mythos-hunter-2-0/browser
          test -d dist/mythos-hunter-2-0/server
          test -f dist/mythos-hunter-2-0/server/server.mjs

      - name: Package artifact
        shell: bash
        run: |
          tar czf mythsworn-dist.tgz -C dist/mythos-hunter-2-0 browser server
          test -s mythsworn-dist.tgz
          ls -lh mythsworn-dist.tgz

      - name: Prepare SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "Missing VPS_HOST secret"
            exit 1
          fi

          if [ -z "$VPS_USER" ]; then
            echo "Missing VPS_USER secret"
            exit 1
          fi

          if [ -z "$VPS_SSH_KEY" ]; then
            echo "Missing VPS_SSH_KEY secret"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/mythsworn_deploy_key
          chmod 600 ~/.ssh/mythsworn_deploy_key

          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload artifact
        shell: bash
        run: |
          scp \
            -i ~/.ssh/mythsworn_deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            mythsworn-dist.tgz \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/deploy-inbox/mythsworn-${{ needs.resolve-target.outputs.target }}-dist.tgz"

      - name: Deploy on VPS
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/mythsworn_deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "/usr/local/bin/deploy_mythsworn_dist.sh ${{ needs.resolve-target.outputs.target }} /var/www/deploy-inbox/mythsworn-${{ needs.resolve-target.outputs.target }}-dist.tgz"

      - name: Smoke on VPS
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/mythsworn_deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "curl -fsS http://127.0.0.1:${{ needs.resolve-target.outputs.port }}/ >/dev/null && pm2 describe mythsworn-${{ needs.resolve-target.outputs.target }}-ssr >/dev/null"