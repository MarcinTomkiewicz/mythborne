@if (currentChallengeResult() || minigameReportPointer()) {
  <app-exploration-report-result-content
    [reportId]="reportId()"
    [rewardText]="rewardText()"
    [isLoadingReward]="rewardState.isLoadingReward()"
    [rewardDisplay]="reportRewardDisplay()"
    [rewardUnavailableMessage]="rewardState.rewardUnavailableMessage()"
  />
}
