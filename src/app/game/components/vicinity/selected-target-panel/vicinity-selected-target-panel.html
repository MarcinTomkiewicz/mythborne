@if (selected()) {
  <app-selected-target-panel-shell
    [eyebrowLabel]="selectedTargetCopy().targetLabel"
    [title]="targetTitle()"
    [subtitle]="targetSubtitle()"
    [reserveSubtitle]="true"
    [factRows]="factRows()"
    [actionRow]="selected()"
    [error]="relocationError()"
    [success]="relocationSuccess()"
    (startAction)="startAction.emit($event)"
  />
}
