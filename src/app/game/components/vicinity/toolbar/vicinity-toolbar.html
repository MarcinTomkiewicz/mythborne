<div class="flex-row-between-start flex-wrap gap-md">
  <div class="flex-col gap-xs">
    <h2 class="color-heading text-lg mb-0">{{ sectionTitle() }}</h2>
    <p class="muted-text mb-0">
      {{ helperText() }}
    </p>
  </div>
</div>

<div class="flex-row-end-end flex-wrap gap-md w-100">
  <div class="flex-row-end-end flex-wrap gap-md" [attr.aria-label]="districtFilterLabel()">
    <div class="flex-col gap-xs min-w-200">
      <label
        class="color-muted small-caps uppercase text-xs"
        [attr.for]="districtSelectId"
      >
        {{ districtFilterLabel() }}
      </label>
      <p-select
        [inputId]="districtSelectId"
        class="w-100"
        [formControl]="selectedDistrictControl()"
        [options]="districtOptions()"
        optionLabel="label"
        optionValue="value"
      />
    </div>

    <label class="flex-col gap-xs min-w-300">
      <span class="color-muted small-caps uppercase text-xs">{{ searchLabel() }}</span>
      <input
        pInputText
        type="search"
        class="w-100"
        [formControl]="searchControl()"
        [placeholder]="searchPlaceholder()"
        autocomplete="off"
        (keydown.enter)="search.emit()"
      />
      @if (searchFeedback()) {
        <span class="error-text text-xs">{{ searchFeedback() }}</span>
      }
    </label>

    <p-button
      [label]="searchButtonLabel()"
      severity="secondary"
      [loading]="isSearching()"
      (onClick)="search.emit()"
    />

    <p-button
      [label]="currentVicinityButtonLabel()"
      severity="secondary"
      [disabled]="isMyVicinityDisabled()"
      (onClick)="focusCurrentAddress.emit()"
    />
  </div>
</div>
