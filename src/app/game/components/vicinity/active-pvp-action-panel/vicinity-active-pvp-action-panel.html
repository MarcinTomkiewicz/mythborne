@if (offer(); as active) {
  <section class="mg-card flex-col gap-md p-lg w-100" aria-label="Aktywna akcja PvP">
    <div class="flex-row-between-start flex-wrap gap-md w-100">
      <div class="flex-col gap-xs">
        <p class="color-muted small-caps uppercase text-xs mb-0">Aktywna akcja PvP</p>
        <h2 class="color-heading text-lg mb-0">{{ active.phaseLabel }}</h2>
        <p class="muted-text mb-0">{{ helperText() }}</p>
      </div>
      <span class="tag-badge tag-badge--warn">{{ active.actionKindLabel }}</span>
    </div>

    <div class="grid-2-1 gap-lg w-100 grid-items-center">
      <app-pending-timer-oracle
        [timer]="timer()"
        [isReady]="false"
        [isResolving]="false"
        [isUpdating]="isLoading()"
        timerAriaLabel="Czas aktywnej akcji PvP"
        progressAriaLabel="Postęp aktywnej akcji PvP"
        pendingLabel="Pozostały czas"
        [pendingHelperText]="pendingHelperText()"
        pendingNeutralHelperText="Aktualizujemy stan aktywnej akcji PvP."
        readyLabel="Akcja gotowa"
        readyTitle="Dotarcie zakończone"
        readyHelperText="Dalsza obsługa odbywa się poza listą celów."
        primaryActionLabel="Odśwież"
        decorativeLabel="PvP"
      />

      <aside class="mg-card p-lg flex-col gap-sm w-100" aria-label="Szczegóły aktywnej akcji PvP">
        @for (row of factRows(); track row.label) {
          <div class="flex-row-between-end gap-md w-100 border-bottom pb-xs">
            <span class="color-muted small-caps uppercase text-xs">{{ row.label }}</span>
            <strong class="text-md text-right">{{ row.value }}</strong>
          </div>
        }
      </aside>
    </div>
  </section>
}
