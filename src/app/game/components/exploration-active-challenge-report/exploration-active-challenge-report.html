@if (challenge.activeChallenge(); as activeChallenge) {
  @if (challenge.hasMinigameChallenge()) {
    @if (activeChallenge.minigameKey && sourceRef(); as sourceRef) {
      <app-minigame-host
        [minigameKey]="activeChallenge.minigameKey"
        [sourceRef]="sourceRef"
        [contextTitle]="challenge.challengeTitle()"
        contextLabel="Walka"
        (completed)="acceptMinigameCompletion($event)"
      />
    }
  } @else {
    <div class="flex-col gap-lg w-100">
      <app-outcome-report-layout
        label="Aktywne wyzwanie"
        [statusLabel]="challenge.challengeStatusLabel()"
        [title]="challenge.challengeTitle()"
        description="Wyprawa czeka na Twoją akcję, zanim będzie można ruszyć dalej."
        iconClass="pi pi-bolt"
      />

      <app-exploration-challenge-details-card />

      <section class="mg-card p-lg flex-col gap-sm w-100">
        <p class="small-caps color-muted text-xs m-0">Akcja niedostępna</p>
        <p class="color-text text-md lh-16 m-0">
          To wyzwanie nie ma teraz dostępnej akcji w tym panelu.
        </p>
      </section>

      <app-exploration-challenge-pending-reward-card />
    </div>
  }
}
