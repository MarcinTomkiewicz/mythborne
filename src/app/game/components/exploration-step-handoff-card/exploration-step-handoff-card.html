@if (resultNarrative(); as narrative) {
  <div class="flex-col gap-lg w-100">
    <section class="mg-card p-lg flex-col gap-md w-100">
      <div class="flex-col gap-xs">
        <p class="small-caps color-muted text-xs m-0">{{ narrative.eyebrow }}</p>
        <h2
          class="text-xl font-display m-0"
          [class.color-heading]="isTitleTone(narrative, 'heading')"
          [class.font-bold]="isTitleTone(narrative, 'heading')"
          [class.info-text]="isTitleTone(narrative, 'info')"
          [class.warn-text]="isTitleTone(narrative, 'warn')"
          [class.success-text]="isTitleTone(narrative, 'success')"
          [class.error-text]="isTitleTone(narrative, 'danger')"
        >
          {{ narrative.title }}
        </h2>
      </div>

      <p class="color-text text-md lh-16 m-0">
        <app-rich-text [fragments]="narrative.narrativeRichText" />
      </p>
    </section>

    @if (rewardRichText(); as rewardFragments) {
      <section class="mg-card p-lg w-100">
        <p class="color-text text-md lh-16 m-0">
          <app-rich-text [fragments]="rewardFragments" />
        </p>
      </section>
    }
  </div>
}
