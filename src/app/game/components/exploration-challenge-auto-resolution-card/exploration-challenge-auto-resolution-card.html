<section class="mg-card p-lg flex-col gap-md">
  <div class="flex-col gap-xs min-w-0">
    <p class="small-caps color-muted text-xs mb-0">Rozstrzygnij próbę</p>
    @if (challenge.canShowAutoResolveAction()) {
      <strong class="color-heading">Automatyczne rozstrzygnięcie</strong>
      <span class="color-text text-sm">{{ challenge.autoResolveExplanation() }}</span>
    } @else {
      <strong class="color-heading">Oczekiwanie na akcję</strong>
      @if (challenge.challengeActionBlocker(); as blocker) {
        <span class="color-text text-sm">{{ blocker }}</span>
      }
    }
  </div>

  @if (challenge.canShowAutoResolveAction()) {
    <div class="flex-row-start-center flex-wrap gap-sm">
      <p-button
        type="button"
        severity="secondary"
        label="Rozstrzygnij automatycznie"
        [loading]="challenge.isCompleting()"
        [disabled]="!challenge.canAutoResolveChallenge()"
        (onClick)="challenge.autoResolve()"
      />
    </div>
  }
</section>
