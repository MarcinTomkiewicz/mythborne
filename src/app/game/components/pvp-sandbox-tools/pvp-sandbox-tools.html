@if (sandbox.canShowSandboxTools()) {
  <app-sandbox-test-tools-strip
    title="Narzędzia testowe PvP"
    helperText="Akcje działają przez sandboxowe RPC i są ukryte poza kontekstem testowym."
  >
    <p-button
      type="button"
      size="small"
      severity="secondary"
      label="Skróć czas"
      [loading]="sandbox.isRunningSandboxTool()"
      [disabled]="!sandbox.canSkipSandboxAttackTravel(offer())"
      (onClick)="skipAttackTravel()"
    />
    <p-button
      type="button"
      size="small"
      severity="secondary"
      label="Dodaj ataki"
      [loading]="sandbox.isRunningSandboxTool()"
      [disabled]="!sandbox.canAddSandboxAttacks()"
      (onClick)="addAttacks()"
    />
  </app-sandbox-test-tools-strip>

  @if (sandbox.feedback(); as feedback) {
    <p class="warn-text mb-0">{{ feedback }}</p>
  }
}
