@if (isCombatMinigame()) {
  <app-combat-host
    [sourceRef]="sourceRef()"
    [contextTitle]="contextTitle()"
    [sourcePresentation]="sourcePresentation()"
    [decisionDeadline]="combatDecisionDeadline()"
    [combatLiveSessionId]="combatLiveSessionId()"
    (completed)="completed.emit($event)"
  />
}
