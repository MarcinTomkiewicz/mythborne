<section class="mg-card flex-col gap-md p-lg w-100 h-100">
  <div class="flex-row-between-center gap-md">
    <div class="flex-col gap-xs">
      <p class="card-legend mb-0">{{ title() }}</p>
      <h3 class="mg-section__title mg-section__title--xs mb-0">{{ combatant().name }}</h3>
    </div>
    <span class="tag-badge tag-badge--muted">Poziom {{ combatant().level }}</span>
  </div>

  <app-game-bar
    label="Zdrowie"
    type="hp"
    [value]="currentHealth()"
    [max]="maxHealth()"
    [compact]="true"
  />

  <app-stat-card
    title="Cechy bazowe"
    [rows]="baseStats()"
  />

  @if (combatStats().length > 0) {
    <app-stat-card
      title="Cechy bojowe"
      [rows]="combatStats()"
    />
  }
</section>
