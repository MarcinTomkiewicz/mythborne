@let model = stage();

<article class="mg-container flex-col gap-lg w-100">
  <app-combat-surface
    [ariaLabel]="model.ariaLabel"
    [leftParticipant]="model.leftParticipant"
    [rightParticipant]="model.rightParticipant"
    [centerPanel]="model.centerPanel"
    [logGroups]="model.log.groups"
    [showLog]="model.log.show"
    [logTitle]="model.log.title"
    [logSubtitle]="model.log.subtitle"
    [logEmptyText]="model.log.emptyText"
    [leftEmptyTitle]="model.emptyParticipants.leftTitle"
    [leftEmptyText]="model.emptyParticipants.leftText"
    [rightEmptyTitle]="model.emptyParticipants.rightTitle"
    [rightEmptyText]="model.emptyParticipants.rightText"
    (centerAction)="action.emit($event)"
    (timingStrike)="timingStrike.emit($event)"
  />
</article>
