<section class="walking-dead-meter flex-col gap-sm w-100 p-sm radius-lg" aria-label="Walking Dead timing">
  <div class="flex-row-between-center flex-col-sm gap-sm">
    <strong class="color-heading font-display">Walking Dead timing</strong>
    <span class="color-muted text-sm">Zatrzymaj wskaźnik w strefie trafienia</span>
  </div>

  <button
    type="button"
    class="walking-dead-meter__field w-100 p-0 cursor-pointer border-0 bg-transparent"
    [class.opacity-70]="disabled()"
    [disabled]="disabled()"
    (click)="onFieldClick()"
  >
    <span #lane class="walking-dead-meter__lane d-block w-100 radius-sm" aria-hidden="true">
      <span
        class="walking-dead-meter__zone"
        [style.left.%]="zoneStart()"
        [style.width.%]="zoneEnd() - zoneStart()"
      ></span>
      <span
        #indicator
        class="walking-dead-meter__indicator"
        [style.left.%]="position()"
      ></span>
    </span>
  </button>

  <div class="flex-row-center-center flex-wrap gap-sm">
    <p-button
      type="button"
      [label]="actionLabel()"
      [loading]="actionLoading()"
      [disabled]="disabled()"
      (onClick)="onFieldClick()"
    />
  </div>

  <div class="flex-row-between-center gap-md w-100 color-muted text-xs">
    <span>Za wcześnie</span>
    <strong class="success-text">Strefa trafienia</strong>
    <span>Za późno</span>
  </div>
</section>
