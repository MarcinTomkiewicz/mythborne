<div class="flex-col gap-lg w-100">
  <section class="flex-row-start-stretch gap-md w-100" [attr.aria-label]="ariaLabel()">
    @if (leftParticipant(); as participant) {
      <app-combat-participant-card [participant]="participant" />
    } @else if (leftEmptyTitle(); as title) {
      @if (leftEmptyText(); as text) {
      <app-combat-empty-participant-card
        [title]="title"
        [text]="text"
      />
      }
    }

    <app-combat-center-panel
      [panel]="centerPanel()"
      (centerAction)="centerAction.emit($event)"
      (timingStrike)="timingStrike.emit($event)"
    >
      <ng-content select="[combatCenter]" />
    </app-combat-center-panel>

    @if (rightParticipant(); as participant) {
      <app-combat-participant-card [participant]="participant" />
    } @else if (rightEmptyTitle(); as title) {
      @if (rightEmptyText(); as text) {
      <app-combat-empty-participant-card
        [title]="title"
        [text]="text"
      />
      }
    }
  </section>

  @if (showLog()) {
    <app-combat-log-panel
      [groups]="logGroups()"
      [title]="logTitle()"
      [subtitle]="logSubtitle()"
      [emptyText]="logEmptyText()"
    />
  }
</div>
