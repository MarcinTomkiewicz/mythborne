<app-loading-overlay [visible]="page.overview.isLoading()" label="" />

@if (page.overview.copy(); as copy) {
  @if (page.overview.context()) {
    <div class="flex-col gap-lg w-100 min-w-0">
      <app-game-page-header
        [eyebrowLabel]="copy.header.eyebrow"
        [title]="copy.header.title"
        [description]="copy.header.intro"
        [summaryRows]="page.headerSummaryRows()"
      />

      @if (page.auctionUnavailableMessage(); as unavailableMessage) {
        <section class="mg-card radius-lg p-md w-100 min-w-0">
          <p-message severity="error">{{ unavailableMessage }}</p-message>
        </section>
      } @else if (page.overview.listingsPage(); as listingsPage) {
        <div class="grid-3-1 gap-md grid-items-start w-100 min-w-0">
          <app-auction-listings-section
            class="w-100 min-w-0"
            [title]="copy.tabs.browse"
            [emptyLabel]="copy.empty.listings"
            [listings]="listingsPage.activeListings"
            [pagination]="listingsPage.pagination"
            [actions]="copy.actions"
            [labels]="copy.labels"
            [isLoading]="page.overview.isLoading()"
            (refresh)="page.applyFilters()"
            (pageChange)="page.changeListingsPage($event)"
          />

          <aside class="flex-col gap-sm w-100 min-w-0">
            <app-auction-filters-panel
              [copy]="copy"
              [filterForm]="page.filterForm"
              [auctionModeOptions]="page.auctionModeOptions()"
              [baseTypeOptions]="page.baseTypeOptions()"
              [sortOptions]="page.sortOptions()"
              [isLoading]="page.overview.isLoading()"
              (apply)="page.applyFilters()"
              (baseTypeSelect)="page.selectBaseType($event)"
            />

            <app-auction-rules-panel [rules]="copy.rules" />
          </aside>
        </div>
      }
    </div>
  }
}
