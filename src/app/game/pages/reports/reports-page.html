<app-loading-overlay [visible]="page.isLoading()" label="" />

@if (page.copy(); as copy) {
  <div class="flex-col gap-lg w-100 min-w-0">
    <app-game-page-header
      [eyebrowLabel]="copy.reportsCenter.header.eyebrow"
      [title]="copy.reportsCenter.header.title"
      [description]="copy.reportsCenter.header.intro"
      [summaryRows]="page.headerSummaryRows"
    />

    @if (page.listPage(); as listPage) {
      <app-report-filters-panel
        [filters]="copy.reportsCenter.filters"
        [filterForm]="page.filtersForm"
        (apply)="page.applyFilters()"
      />

      <app-report-list-section
        [title]="copy.reportsCenter.list.title"
        [emptyTitle]="copy.reportsCenter.list.emptyTitle"
        [emptyText]="copy.reportsCenter.list.emptyText"
        [unreadLabel]="copy.reportsCenter.list.unreadLabel"
        [readLabel]="copy.reportsCenter.list.readLabel"
        [unreadCount]="listPage.unreadCount"
        [reports]="listPage.reports"
        [pagination]="listPage.pagination"
        [labels]="copy.labels"
        [detailSections]="copy.detail.sections"
        (pageChange)="page.changeReportsPage($event)"
      />
    }
  </div>
}
