<app-loading-overlay [visible]="page.isLoading()" label="" />

@if (page.copy(); as copy) {
  <div class="flex-col gap-lg w-100 min-w-0">
    <app-game-page-header
      [eyebrowLabel]="copy.reportsCenter.header.eyebrow"
      [title]="copy.reportsCenter.header.title"
      [description]="copy.reportsCenter.header.intro"
      [summaryRows]="page.headerSummaryRows"
    />

    @if (page.listPage(); as listPage) {
      <section class="mg-card radius-lg p-md flex-col gap-sm w-100 min-w-0">
        <h2 class="color-heading font-display text-lg m-0">
          {{ copy.reportsCenter.list.title }}
        </h2>
        <span class="color-muted text-sm">{{ listPage.pagination.displayLabel }}</span>
      </section>
    }
  </div>
}
