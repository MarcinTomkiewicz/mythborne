<app-loading-overlay [visible]="page.isLoading()" />

@if (page.detail(); as detail) {
  @if (isPrivatePvpDetail(detail)) {
    <div class="mg-container flex-col gap-lg w-100 min-w-0">
      <app-game-page-header
        [eyebrowLabel]="detail.reportShellContextJson.eyebrow"
        [title]="detail.reportShellContextJson.title"
        [description]="detail.reportShellContextJson.summary"
        [summaryRows]="headerSummaryRows()"
      />

      <app-pvp-report-domain-content
        [detail]="detail"
        [copy]="page.pvpPrivateReportCopy()"
        [activeHeroId]="detail.access.heroId"
      />
    </div>
  } @else if (page.copy(); as copy) {
    <div class="mg-container flex-col gap-lg w-100 min-w-0">
      <app-game-page-header
        [eyebrowLabel]="detail.reportShellContextJson.eyebrow"
        [title]="detail.reportShellContextJson.title"
        [description]="detail.reportShellContextJson.summary"
        [summaryRows]="headerSummaryRows()"
      />

      <app-report-detail-sections
        [detail]="detail"
        [activeHeroId]="detail.access.heroId"
        [shellCopy]="copy.reportShell"
      />
    </div>
  }
} @else if (page.hasError()) {
  @if (page.copy(); as copy) {
    <section class="mg-container mg-card flex-col gap-sm p-lg w-100">
      <h1 class="color-heading text-xl m-0">{{ copy.reportShell.public.notFoundTitle }}</h1>
      <p class="color-text text-md lh-16 m-0">{{ copy.reportShell.public.notFoundText }}</p>
    </section>
  }
}
