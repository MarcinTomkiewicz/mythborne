<article
  class="mg-data-row mg-data-row--listing cursor-pointer"
  role="button"
  tabindex="0"
  [class.border-secondary]="selected()"
  [attr.aria-pressed]="selected()"
  (click)="select()"
  (keydown)="selectFromKeyboard($event)"
>
  <div class="flex-col gap-xs flex-none">
    <span class="mg-chip radius-pill py-xs px-sm text-xs color-heading">
      {{ report().marker.markerLabel }}
    </span>
    @if (report().isUnread) {
      <span class="mg-chip radius-pill py-xs px-sm text-xs color-muted">
        {{ copy().unreadLabel }}
      </span>
    }
  </div>

  <div class="flex-col gap-xs min-w-0">
    <h3 class="m-0">
      <button
        class="bg-transparent border-0 p-0 color-heading text-md text-break text-left cursor-pointer"
        type="button"
        (click)="$event.stopPropagation(); select()"
      >
        {{ report().title }}
      </button>
    </h3>
    <div class="flex-row-start-center flex-wrap gap-sm w-100 min-w-0">
      <span class="mg-chip radius-pill py-xs px-sm text-xs color-muted">
        {{ report().source.label }}
      </span>
      <span class="mg-chip radius-pill py-xs px-sm text-xs color-muted">
        {{ report().eventType.label }}
      </span>
    </div>
  </div>

  <div class="flex-col gap-xs text-right flex-none">
    <time class="color-heading text-sm" [attr.datetime]="report().reportDate.value">
      {{ report().reportDate.displayValue ?? report().reportDate.value }}
    </time>
    <a
      class="mg-chip radius-pill py-xs px-sm text-xs color-muted"
      [routerLink]="report().preview.publicAccess.privatePath"
      (click)="$event.stopPropagation()"
    >
      {{ copy().openAction }}
    </a>
  </div>
</article>
