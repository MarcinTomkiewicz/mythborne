<article
  class="mg-data-row mg-data-row--listing mg-card--interactive p-sm cursor-pointer"
  role="button"
  tabindex="0"
  [class.mg-card--selected]="selected()"
  [attr.aria-pressed]="selected()"
  (click)="select()"
  (keydown)="selectFromKeyboard($event)"
>
  <span
    class="mg-card square-11 radius-lg flex-row-center-center font-extrabold p-0"
    [class]="markerToneClass()"
    aria-hidden="true"
  >
    @if (hasMarkerIcon()) {
      <i [class]="markerIconClass()"></i>
    } @else {
      {{ report().marker.markerLabel }}
    }
  </span>

  <div class="flex-col gap-xs min-w-0">
    <h3 class="m-0">
      <strong class="d-block color-heading text-sm lh-13 text-break font-extrabold">
        {{ report().title }}
      </strong>
    </h3>
    <p class="color-muted text-sm lh-14 m-0 text-break">
      {{ report().source.label }} &middot; {{ report().eventType.label }}
    </p>
  </div>

  <div class="flex-col gap-xs text-right flex-none min-w-0">
    <time class="color-muted text-xs text-nowrap" [attr.datetime]="report().reportDate.value">
      {{ report().reportDate.displayValue ?? report().reportDate.value }}
    </time>
    @if (report().isUnread) {
      <span class="color-heading text-lg lh-1 ml-auto" aria-hidden="true">&bull;</span>
    }
  </div>
</article>
