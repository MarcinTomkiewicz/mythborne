<div class="flex-col gap-lg w-100 min-w-0">
  @if (combatStage(); as combat) {
    <app-combat-surface
      [ariaLabel]="combat.ariaLabel"
      [leftParticipant]="combat.leftParticipant"
      [rightParticipant]="combat.rightParticipant"
      [centerPanel]="combat.centerPanel"
      [logGroups]="combat.log.groups"
      [showLog]="combat.log.show"
      [logTitle]="combat.log.title"
      [logSubtitle]="combat.log.subtitle"
      [logEmptyText]="combat.log.emptyText"
      [leftEmptyTitle]="combat.emptyParticipants.leftTitle"
      [leftEmptyText]="combat.emptyParticipants.leftText"
      [rightEmptyTitle]="combat.emptyParticipants.rightTitle"
      [rightEmptyText]="combat.emptyParticipants.rightText"
    />

    @if (publicReportPath()) {
      <section class="mg-card p-lg flex-col gap-sm w-100">
        <p-button
          type="button"
          [label]="shareActionLabel()"
          icon="pi pi-link"
          severity="secondary"
          [text]="true"
          (onClick)="copyPublicReportLink()"
        />
      </section>
    }
  }
</div>
