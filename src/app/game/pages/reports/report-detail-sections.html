<div class="flex-col gap-lg w-100 min-w-0">
  @if (privateExplorationPreview(); as preview) {
    <app-report-detail-preview-display
      [label]="detail().report.reportTypeLabel"
      [view]="preview"
      [showActions]="false"
    />
  } @else if (privatePvpDetail(); as pvpDetail) {
    <app-pvp-report-domain-content
      [detail]="pvpDetail"
      [copy]="pvpPrivateReportCopy()"
      [activeHeroId]="activeHeroId()"
    />
  } @else if (combatStage(); as stage) {
    <app-combat-stage [stage]="stage" />
  }

  @if (reportActions(); as actions) {
    @if (actions.publicReportPath) {
      <app-report-handoff-actions
        [actions]="actions"
        heading=""
        [publicReportCopyLabel]="shellCopy()?.header?.copyLinkAction ?? null"
        [publicReportToastTitle]="shellCopy()?.header?.copyLinkAction ?? null"
        [publicReportCopySuccessMessage]="shellCopy()?.feedback?.copyLinkSuccess ?? null"
        [showDirectReportAction]="false"
      />
    }
  }
</div>
