<div class="flex-col gap-lg w-100 min-w-0">
  @if (isPrivateExploration()) {
    <app-exploration-report-domain-content [detail]="detail()" />
  } @else if (privatePvpDetail(); as pvpDetail) {
    @if (pvpPrivateReportCopy(); as copy) {
      <app-pvp-report-domain-content
        [detail]="pvpDetail"
        [copy]="copy"
        [activeHeroId]="activeHeroId()"
      />
    }
  } @else if (combatStage(); as stage) {
    <app-combat-stage [stage]="stage" />
  }

  @if (publicReportPath()) {
    <section class="mg-card p-lg flex-col gap-sm w-100">
      <p-button
        type="button"
        [label]="shellCopy().header.copyLinkAction"
        icon="pi pi-link"
        severity="secondary"
        [text]="true"
        (onClick)="copyPublicReportLink()"
      />
    </section>
  }
</div>
