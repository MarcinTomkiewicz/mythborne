<section class="mg-card p-sm flex-col gap-sm w-100 min-w-0">
  <div class="flex-row-between-center flex-wrap gap-md w-100 min-w-0">
    <div
      class="flex-row-start-center gap-sm min-w-0"
      (click)="$event.stopPropagation()"
      (keydown)="$event.stopPropagation()"
    >
      <p-button
        type="button"
        severity="secondary"
        [label]="visibleSelectionActionCopy().label"
        [ariaLabel]="visibleSelectionActionCopy().ariaLabel"
        [attr.title]="visibleSelectionActionCopy().tooltip"
        [disabled]="reports().length === 0 || isLoading()"
        (click)="toggleVisibleReportSelection.emit()"
      />
    </div>

    <div class="flex-row-end-center flex-wrap gap-sm min-w-0">
      @if (markAllReadSupported() && !markAllReadEnabled()) {
        <span class="color-muted text-sm">{{ actionsCopy().markAllRead.disabledTooltip }}</span>
      }
      <p-button
        type="button"
        severity="secondary"
        [label]="actionsCopy().markSelectedRead.label"
        [ariaLabel]="actionsCopy().markSelectedRead.ariaLabel"
        [attr.title]="actionsCopy().markSelectedRead.disabledTooltip"
        [disabled]="true"
      />
      <p-button
        type="button"
        severity="danger"
        [label]="actionsCopy().deleteSelected.label"
        [ariaLabel]="actionsCopy().deleteSelected.ariaLabel"
        [attr.title]="actionsCopy().deleteSelected.disabledTooltip"
        [disabled]="true"
      />
    </div>
  </div>

  @if (reports().length === 0) {
    <section class="mg-card radius-lg p-md flex-col gap-xs lh-15 w-100 min-w-0">
      <strong class="color-heading">{{ copy().emptyTitle }}</strong>
      <span class="color-muted text-sm">{{ copy().emptyText }}</span>
    </section>
  } @else {
    <div class="flex-col gap-sm w-100 min-w-0">
      @for (report of reports(); track report.reportId) {
        <app-report-list-row
          [report]="report"
          [selected]="selectedReportId() === report.reportId"
          [selectionChecked]="selectedReportIds().includes(report.reportId)"
          [eventTypeCopy]="eventTypeCopy(report)"
          [selectReportRowActionCopy]="actionsCopy().selectReportRow"
          [markReadActionCopy]="actionsCopy().markOneRead"
          [deleteActionCopy]="actionsCopy().deleteOne"
          (selectReport)="selectReport.emit($event)"
          (toggleReportSelection)="toggleReportSelection.emit($event)"
        />
      }
    </div>
  }

  <nav class="mg-card radius-lg flex-row-between-center flex-wrap gap-md p-md w-100 min-w-0">
    <strong class="color-text text-sm">{{ pagination().displayLabel }}</strong>
    <p-paginator
      [first]="pagination().offset"
      [rows]="pagination().limit"
      [totalRecords]="pagination().totalCount"
      (onPageChange)="pageChange.emit($event)"
    />
  </nav>
</section>
