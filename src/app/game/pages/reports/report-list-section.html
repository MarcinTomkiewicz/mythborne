<section class="mg-card radius-lg p-md flex-col gap-sm w-100 min-w-0">
  <div class="flex-row-between-center flex-wrap gap-md w-100 min-w-0">
    <div class="flex-col gap-xs min-w-0">
      <h2 class="color-heading font-display text-lg m-0">
        {{ title() }}
      </h2>
      <span class="color-muted text-sm">{{ pagination().displayLabel }}</span>
    </div>

    <span class="mg-chip radius-pill py-xs px-sm text-xs color-muted">
      {{ unreadLabel() }} {{ unreadCount() }}
    </span>
  </div>

  @if (reports().length === 0) {
    <section class="mg-card radius-lg p-md flex-col gap-xs w-100 min-w-0">
      <strong class="color-heading">{{ emptyTitle() }}</strong>
      <span class="color-muted text-sm">{{ emptyText() }}</span>
    </section>
  } @else {
    <div class="flex-col gap-sm w-100 min-w-0">
      @for (report of reports(); track report.reportId) {
        <app-report-list-row
          [report]="report"
          [openActionLabel]="openActionLabel()"
          [unreadLabel]="unreadLabel()"
          [readLabel]="readLabel()"
          [labels]="labels()"
          [detailSections]="detailSections()"
        />
      }
    </div>
  }

  <nav class="mg-card radius-lg flex-row-between-center flex-wrap gap-md p-md w-100 min-w-0">
    <strong class="color-heading text-sm">{{ pagination().displayLabel }}</strong>
    <p-paginator
      [first]="pagination().offset"
      [rows]="pagination().limit"
      [totalRecords]="pagination().totalCount"
      (onPageChange)="pageChange.emit($event)"
    />
  </nav>
</section>
