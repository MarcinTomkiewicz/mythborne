<section class="mg-card p-sm flex-col gap-sm w-100 min-w-0">
  <div class="flex-row-end-center flex-wrap gap-md w-100 min-w-0">
    @if (markAllReadSupported()) {
      <div class="flex-row-end-center flex-wrap gap-sm min-w-0">
        @if (!markAllReadEnabled()) {
          <span class="color-muted text-sm">{{ markAllReadDisabledTooltip() }}</span>
        }
        <p-button
          type="button"
          severity="secondary"
          [label]="markAllReadLabel()"
          [disabled]="!markAllReadEnabled() || isLoading()"
          (click)="markAllRead.emit()"
        />
      </div>
    }
  </div>

  @if (reports().length === 0) {
    <section class="mg-card radius-lg p-md flex-col gap-xs lh-15 w-100 min-w-0">
      <strong class="color-heading">{{ copy().emptyTitle }}</strong>
      <span class="color-muted text-sm">{{ copy().emptyText }}</span>
    </section>
  } @else {
    <div class="flex-col gap-sm w-100 min-w-0">
      @for (report of reports(); track report.reportId) {
        <app-report-list-row
          [report]="report"
          [selected]="selectedReportId() === report.reportId"
          (selectReport)="selectReport.emit($event)"
        />
      }
    </div>
  }

  <nav class="mg-card radius-lg flex-row-between-center flex-wrap gap-md p-md w-100 min-w-0">
    <strong class="color-text text-sm">{{ pagination().displayLabel }}</strong>
    <p-paginator
      [first]="pagination().offset"
      [rows]="pagination().limit"
      [totalRecords]="pagination().totalCount"
      (onPageChange)="pageChange.emit($event)"
    />
  </nav>
</section>
