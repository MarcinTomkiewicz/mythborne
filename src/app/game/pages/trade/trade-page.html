<app-loading-overlay [visible]="page.overview.isLoading()" label="" />

@if (page.overview.copy(); as copy) {
  @if (page.overview.context()) {
    <div class="flex-col gap-lg w-100 min-w-0">
      <app-game-page-header
        [eyebrowLabel]="copy.header.eyebrow"
        [title]="copy.header.title"
        [description]="copy.header.intro"
        [summaryRows]="page.headerSummaryRows()"
      />

      @if (page.tradeUnavailableMessage(); as unavailableMessage) {
        <section class="mg-card radius-lg p-md w-100 min-w-0">
          <p-message severity="error">
            @if (page.tradeUnavailableTitle(); as title) {
              <strong class="d-block color-heading mb-xs">{{ title }}</strong>
            }
            <span>{{ unavailableMessage }}</span>
          </p-message>
        </section>
      }
    </div>
  }
}
