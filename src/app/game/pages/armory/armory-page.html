<app-loading-overlay [visible]="isScreenLoading()" ariaLabel="Loading armory" />

<app-structured-confirm-dialog
  [key]="sellConfirmation.key"
  styleClass="mg-dialog mg-dialog--danger"
  [content]="sellConfirmation.content()"
  (hidden)="clearSellItemConfirmationMessage()"
/>

@if (page.context(); as context) {
  @let copy = context.copyJson;
  @let readModel = context.readModel;

  <div class="flex-col gap-lg min-w-0">
    <app-game-page-header
      [eyebrowLabel]="copy.sections.inventory"
      [title]="copy.page.title"
      [summaryRows]="summaryRows()"
    />

    <div class="grid-1-2-balanced gap-lg w-100">
      <section class="flex-col gap-md min-w-0">
        <app-equipment-preview
          [rows]="equipmentPreviewRows()"
          [title]="copy.equipmentPreview.title"
          [emptyLabel]="copy.equipmentPreview.emptyLabel"
          [emptySlotLabel]="copy.equipmentPreview.emptySlotLabel"
          [emptySlotDetail]="copy.equipmentPreview.emptySlotDetail"
          [loadingLabel]="copy.equipmentPreview.loadingLabel"
          [unavailableLabel]="copy.equipmentPreview.unavailableLabel"
          [armoryLabel]="copy.equipmentPreview.armoryLabel"
          [unequipSelectedLabel]="copy.actions.unequipSelected"
          [unequipAllLabel]="copy.actions.unequipAll"
          [isArmory]="true"
          [showActions]="true"
          [compact]="true"
          [showSlotLabels]="false"
          [selectedItemIds]="selection.selectedEquippedItemIds()"
          [selectionActionDisabled]="page.isEquipmentMutating()"
          (equippedItemToggle)="selection.toggleEquippedItemSelection($event)"
          (unequipSelected)="unequipSelectedItems()"
          (unequipAll)="unequipAllItems()"
        />

        <app-loadout-preset-management
          [presets]="context.loadoutPresets"
          [title]="copy.sections.loadoutPresets"
          [copy]="copy.loadoutPresets"
          [actionsCopy]="copy.actions"
          [cancelLabel]="copy.confirmations.cancelLabel"
        />
      </section>

      <app-armory-inventory-section
        [title]="copy.sections.inventory"
        [shelves]="readModel.shelves"
        [searchCopy]="copy.search"
        [filtersCopy]="copy.filters"
        [inventoryCopy]="copy.inventory"
        [equipItemLabel]="copy.actions.equipItem"
        [bulkEquipItemLabel]="copy.actions.equipSelected"
        [bulkSellItemLabel]="copy.actions.sellSelected"
        [sellItemLabel]="copy.actions.sellItem"
        [renameStorageSlotLabel]="copy.actions.renameStorageSlot"
        [cancelLabel]="copy.confirmations.cancelLabel"
        [actionDisabled]="inventoryActionDisabled()"
        [selectedItemIds]="selection.selectedInventoryItemIds()"
        (selectedItemIdsChange)="selection.selectedInventoryItemIds.set($event)"
        (equipItem)="equipInventoryItem($event)"
        (bulkEquipItems)="bulkEquipInventoryItems($event)"
        (bulkSellItems)="bulkSellInventoryItems($event)"
        (bulkMoveItems)="bulkMoveInventoryItems($event)"
        (sellItem)="confirmSellInventoryItem($event)"
        (renameShelf)="renameInventoryShelf($event)"
      />
    </div>
  </div>
} @else if (page.error(); as error) {
  <section class="mg-card p-lg flex-col gap-sm w-100">
    <p class="warn-text mb-0">{{ error }}</p>
  </section>
}
