<div class="flex-col gap-lg min-w-0">
  <app-loading-overlay
    [visible]="pvpAction.isLoading()"
    ariaLabel="Loading combat"
  />

  @if (pvpAction.copy(); as actionCopy) {
    <app-pvp-sandbox-tools
      [offer]="pvpAction.visibleOffer()"
      (refreshActiveOffer)="refreshActivePvpOffer()"
      (refreshAttackCounters)="refreshActivePvpOffer()"
    />

    <app-pvp-active-action-panel
      [offer]="pvpAction.visibleOffer()"
      [copy]="actionCopy"
      [sourcePresentation]="pvpAction.combatSourcePresentation()"
      [timer]="pvpAction.timer()"
      [factRows]="pvpAction.factRows()"
      [isLoading]="pvpAction.isLoading()"
      [isTimerReady]="pvpAction.isTimerReady()"
      [isArrivalReady]="pvpAction.isAttackArrivalReady()"
      [renderCombatHost]="true"
      (refresh)="refreshActivePvpOffer()"
    />

    @if (pvpAction.error()) {
      <p class="warn-text mb-0">{{ pvpAction.error() }}</p>
    }
  } @else if (pvpAction.error()) {
    <p class="warn-text mb-0">{{ pvpAction.error() }}</p>
  }
</div>
