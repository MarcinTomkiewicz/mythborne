@let currentOption = option();

<article
  class="mg-card p-lg flex-row-start-center gap-md h-100 user-select-none shadow-premium transition-colors"
  role="button"
  [attr.tabindex]="canChoose() ? 0 : -1"
  [attr.aria-disabled]="!canChoose()"
  [class.cursor-pointer]="canChoose()"
  [class.cursor-default]="!canChoose()"
  [class.opacity-55]="isDisabled() || !currentOption.isAvailable"
  (click)="choose($event)"
  (keydown.enter)="choose($event)"
  (keydown.space)="choose($event)"
>
  <span class="mg-card p-sm flex-row-center-center flex-none color-secondary square-9 shadow-premium">
    <i [class]="iconClass()" aria-hidden="true"></i>
  </span>

  <div class="flex-col gap-xs min-w-0 w-100">
    <strong class="color-heading text-lg">{{ label() }}</strong>
    <span class="color-muted text-sm text-nowrap">{{ statusLabel() }}</span>
    <span class="color-secondary text-sm font-semibold">{{ actionLabel() }}</span>
  </div>

  @if (isDisabled() || !currentOption.isAvailable) {
    <span class="tag-badge tag-badge--warn flex-none">Unavailable</span>
  }
</article>
