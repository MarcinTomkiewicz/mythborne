@let preview = difficulty();
@let articleCopy = copy();
@let trialCopy = articleCopy.trialDetails;

<div class="flex-col gap-sm mt-lg">
  <div class="flex-row-between-center flex-col-sm gap-sm">
    <div class="flex-col gap-xs">
      <h4 class="mg-section__title mg-section__title--xs mb-0">
        {{ trialCopy.section.title }}
      </h4>
      <p
        class="muted-text mb-0"
        [attr.aria-label]="trialCopy.section.descriptionPlainText"
      >
        <app-rich-text [fragments]="trialCopy.section.descriptionRichText" />
      </p>
    </div>
    <span class="tag-badge tag-badge--info">
      {{ trialCopy.labels.selectedDifficulty }}: {{ selectedDifficultyCopy().title }}
    </span>
  </div>

  <div class="mg-grid grid-cols-3 grid-cols-1-md gap-sm w-100">
    @for (row of preview.statDetails; track row.statKey) {
      <article class="mg-card p-md w-100 h-100">
        <div class="flex-col gap-sm w-100 h-100">
          <div class="flex-col gap-xs w-100">
            <strong>{{ trialLabel(row.statKey) }}</strong>
          </div>

          <div class="flex-col gap-sm w-100">
            <app-exploration-chance-metric-row
              [label]="trialCopy.labels.manifestation"
              [display]="row.manifestationDisplay"
              [value]="row.manifestationChance"
            />
            <app-exploration-chance-metric-row
              [label]="trialCopy.labels.autoResult"
              [display]="row.autoResultDisplay"
              [value]="row.autoResultSuccessChance"
            />
          </div>
        </div>
      </article>
    }
  </div>
</div>
