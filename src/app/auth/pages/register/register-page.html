<section class="flex-col-center-center min-h-full w-100 py-xl" aria-label="Zakładanie konta">
  <div class="flex-col gap-lg w-100 max-w-500">
    <header class="flex-col-center-center gap-xs w-100 text-center">
      <p class="color-secondary text-xs font-extrabold uppercase m-0">Konto Mythsworn</p>
      <h1 class="mg-section__title m-0">Załóż konto</h1>
    </header>

    <section class="mg-card flex-col-center-center gap-md w-100">
      <div class="flex-col gap-md w-100 max-w-350">
        <form
          [formGroup]="page.form"
          class="mg-form flex-col gap-md w-100"
          (ngSubmit)="page.register()"
        >
          <h2 class="mg-section__title mg-section__title--xs m-0">Rejestracja</h2>

          <app-form-fields [form]="page.form" [fields]="page.fields" />

          @if (page.hasPasswordMismatch()) {
            <p class="m-0 text-danger">Hasła muszą być takie same.</p>
          }

          @if (page.errorMessage()) {
            <p class="m-0 text-danger">{{ page.errorMessage() }}</p>
          }

          @if (page.successMessage()) {
            <div class="mg-card mg-card--selected flex-col gap-sm w-100">
              <p class="m-0 color-heading">{{ page.successMessage() }}</p>
              <a routerLink="/auth/login" class="text-sm font-bold">Przejdź do logowania</a>
            </div>
          }

          <p-button
            type="submit"
            [label]="page.isSubmitting() ? 'Zakładanie konta...' : 'Załóż konto'"
            icon="pi pi-user-plus"
            [disabled]="page.form.invalid || page.isSubmitting()"
          />
        </form>

        <div class="flex-row-center-center flex-wrap gap-xs">
          <span class="color-muted text-sm">Masz konto?</span>
          <a routerLink="/auth/login" class="text-sm font-bold">Zaloguj</a>
        </div>
      </div>
    </section>
  </div>
</section>
