<section class="mg-card mg-card--legend">
  <p class="card-legend">Create Character</p>

  @switch (step()) {
    @case (0) {
      <app-step-account [form]="accountForm" (next)="nextStep()" />
    }
    @case (1) {
      <app-step-origin
        [selectedOrigin]="selectedOrigin()"
        (next)="onOriginNext($event)"
        (back)="prevStep()"
      />
    }
    @case (2) {
      <app-step-user [form]="userForm" (back)="prevStep()" (submit)="submit()" />
    }
  }
</section>
