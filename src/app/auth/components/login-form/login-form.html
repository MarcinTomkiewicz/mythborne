<form
  [formGroup]="form"
  class="mg-form flex-col gap-md w-100"
  (ngSubmit)="submit()"
>
  @if (showHeader()) {
    <h2 class="mg-section__title mg-section__title--xs m-0">Logowanie</h2>
  }

  <app-form-fields [form]="form" [fields]="fields" />

  @if (errorMessage()) {
    <p class="m-0 text-danger">{{ errorMessage() }}</p>
  }

  <p-button
    type="submit"
    [label]="submitting() ? 'Logowanie...' : 'Zaloguj'"
    icon="pi pi-sign-in"
    [disabled]="form.invalid || submitting()"
  />
</form>
