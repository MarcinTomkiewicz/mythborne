<form
  [formGroup]="form"
  class="mg-form w-100"
  [ngClass]="isHorizontal() ? 'flex-row-start-end gap-md' : 'flex-col gap-md'"
  (ngSubmit)="submit()"
>
  @if (showHeader()) {
    <h2 class="mg-section__title mg-section__title--xs mb-sm">Log in</h2>
  }

  <app-form-fields [form]="form" [fields]="fields" />

  @if (errorMessage()) {
    <p class="error-text mb-0">{{ errorMessage() }}</p>
  }

  <p-button type="submit" label="Log in" [disabled]="form.invalid"></p-button>
</form>
