@if (page().equipmentPreviewCopy(); as copy) {
  <app-equipment-preview
    [rows]="page().equipmentPreviewRows()"
    [title]="copy.title"
    [emptyLabel]="copy.emptyLabel"
    [emptySlotLabel]="copy.emptySlotLabel"
    [emptySlotDetail]="copy.emptySlotDetail"
    [loadingLabel]="copy.loadingLabel"
    [unavailableLabel]="copy.unavailableLabel"
    [armoryLabel]="copy.armoryLabel"
    [isArmory]="false"
    [isLoading]="page().isEquipmentLoading()"
    [isUnavailable]="page().equipmentStatus() === 'error'"
    [error]="page().equipmentError()"
    [compact]="compact()"
    [showSlotLabels]="!compact()"
    [paperdollImageUrl]="paperdollImageUrl()"
    armoryLink="/game/armory"
  />
}
