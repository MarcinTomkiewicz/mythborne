<section class="mg-card p-lg w-100">
  <div class="flex-row-between-center flex-col-sm gap-md">
    <div class="flex-col gap-xs">
      <h3 class="mg-section__title mg-section__title--xs mb-0">Następne kroki</h3>
    </div>

    <div class="flex-row-start-center flex-wrap gap-sm">
      <a routerLink="/game/exploration" class="tag-badge tag-badge--info">
        Kontynuuj eksplorację
      </a>
      @if (page().characterPoints() > 0) {
        <a routerLink="/hero/attributes" class="tag-badge tag-badge--warn">
          Wydaj punkty postaci
        </a>
      }
      @if (page().estateAddress()) {
        <a routerLink="/game/vicinity" class="tag-badge tag-badge--muted">
          Otwórz okolicę
        </a>
      }
    </div>
  </div>
</section>
