@if (visible()) {
  <div class="mg-loading-overlay">
    <div class="mg-card flex-col-center-center gap-md p-lg w-100 max-w-350 text-center">
      <p-progress-spinner [ariaLabel]="effectiveAriaLabel()" strokeWidth="4" />
      <div class="flex-col-center-center gap-xs">
        @if (label()) {
          <div class="flex-row-start-center gap-xs">
            <p class="heading-color mb-0"><strong>{{ label() }}</strong></p>
            @if (copyEditTargets()?.label; as target) {
              <app-game-copy-edit-trigger
                [gameCopyKind]="target.gameCopyKind"
                [copyPath]="target.copyPath"
                [locale]="target.locale"
              />
            }
          </div>
        }
        @if (description()) {
          <div class="flex-row-start-center gap-xs">
            <p class="muted-text mb-0">{{ description() }}</p>
            @if (copyEditTargets()?.description; as target) {
              <app-game-copy-edit-trigger
                [gameCopyKind]="target.gameCopyKind"
                [copyPath]="target.copyPath"
                [locale]="target.locale"
              />
            }
          </div>
        }
      </div>
    </div>
  </div>
}
