<div class="flex-col gap-xs w-100">
  @if (showLabel() || showValue()) {
    <div class="flex-row-between-center gap-sm muted-text">
      @if (showLabel()) {
        <span>{{ label() }}</span>
      } @else {
        <span></span>
      }

      @if (showValue()) {
        <span class="heading-color">{{ value() }} / {{ max() }}</span>
      }
    </div>
  }

  <div
    class="game-bar__track"
    [class.game-bar__track--compact]="compact()"
    [class.game-bar__track--xp]="isXp()"
  >
    <div
      class="game-bar__fill"
      [class.game-bar__fill--hp]="isHp()"
      [class.game-bar__fill--xp]="isXp()"
      [style.width.%]="percentValue()"
    ></div>
  </div>
</div>
