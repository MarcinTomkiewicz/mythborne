<div class="carousel-wrapper">
  <button class="nav prev" type="button" (click)="prev()">❮</button>

  <div class="carousel-content">
    <div class="images">
      @for (origin of origins(); track origin.id; let i = $index) {
      <div
        class="carousel-image"
        [class.center]="i === index()"
        [class.left]="i === getLeftIndex()"
        [class.right]="i === getRightIndex()"
        [class.hidden]="!isVisible(i)"
      >
        <img [src]="origin.imageUrl" [alt]="origin.name" />
      </div>
      }
    </div>

    <div class="origin-info">
      <h2 class="text-xl font-semibold text-center mb-2">
        {{ origins()[index()]?.name }}
      </h2>

      <p class="text-center italic text-sm text-gray-600">
        {{ origins()[index()]?.description }}
      </p>

      <div class="bonuses mt-4 flex flex-wrap gap-2 justify-center">
        @for (bonus of bonuses(); track bonus.id) {
        <span class="bg-surface-200 text-sm px-2 py-1 rounded">
          <strong>{{ statLabels()?.[bonus.target] ?? bonus.target }}</strong
          >:
          {{ bonus.value > 0 ? "+" + bonus.value : bonus.value }}
        </span>
        }
      </div>
    </div>
  </div>

  <button class="nav next" type="button" (click)="next()">❯</button>
</div>
