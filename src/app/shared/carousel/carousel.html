<div class="carousel-wrapper">
  <button
    class="nav prev"
    type="button"
    (click)="prev()"
    aria-label="Previous origin"
  >
    &#10094;
  </button>

  <div class="carousel-content">
    <div class="images">
      @for (origin of origins(); track origin.id; let i = $index) {
        <div
          class="carousel-image"
          [class.center]="i === index()"
          [class.left]="i === getLeftIndex()"
          [class.right]="i === getRightIndex()"
          [class.hidden]="!isVisible(i)"
        >
          <img [src]="origin.imageUrl" [alt]="origin.name" />
        </div>
      }
    </div>

    <div class="origin-info">
      <h2 class="heading-color text-center mb-sm">
        {{ origins()[index()]?.name }}
      </h2>

      <p class="origin-info__description text-center mb-0">
        {{ origins()[index()]?.description }}
      </p>

      <div class="bonuses flex-row-center-center flex-wrap gap-sm mt-lg">
        @for (bonus of bonuses(); track bonus.id) {
          <span class="tag-badge tag-badge--info">
            <strong>{{ statLabels()?.[bonus.target] ?? bonus.target }}</strong
            >:
            {{ bonus.value > 0 ? "+" + bonus.value : bonus.value }}
          </span>
        }
      </div>
    </div>
  </div>

  <button
    class="nav next"
    type="button"
    (click)="next()"
    aria-label="Next origin"
  >
    &#10095;
  </button>
</div>
