<div
  class="bar-wrapper"
  [class.hp]="type() === 'hp'"
  [class.xp]="type() === 'xp'"
  [style.--fill-color]="fillColor()"
  [style.--partial]="partialFill()"
>
  <div class="bar-label">
    <span>{{ label() }}</span>
    <span class="bar-value">{{ value() }} / {{ max() }}</span>
  </div>

  <div class="stepped-bar">
    @for (_ of steps; let i = $index; track $index) {
      <div [class.filled]="i < filledSteps()" [class.partial]="i === filledSteps()"></div>
    }
  </div>
</div>
