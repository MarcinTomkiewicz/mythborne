<section class="mg-card p-lg w-100 h-100">
  <div class="flex-row-between-center gap-md mb-md">
    <div class="flex-col gap-xs">
      <h3 class="mg-section__title mg-section__title--xs mb-0">
        {{ title() }}
      </h3>
    </div>
  </div>

  <div class="mg-grid grid-cols-3 grid-cols-2-md grid-cols-1-sm gap-md">
    @for (stat of rows(); track stat.key) {
      <article class="mg-card flex-col p-sm">
        <span class="color-muted text-xs small-caps uppercase">{{ stat.label }}</span>
        <strong [class]="stat.valueClass">{{ stat.value }}</strong>
      </article>
    }
  </div>
</section>
