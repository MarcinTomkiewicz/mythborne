<div class="mg-surface-card flex-col gap-md p-md">
  <div class="flex-row-between-center flex-col-sm gap-md">
    <div class="flex-col gap-xs">
      <p class="card-legend mb-0">Bonuses</p>
      <p class="mb-0 muted-text">Base bonus values used by the global building bonus formula.</p>
    </div>

    <p-button label="Add bonus" [text]="true" (onClick)="page().bonusEditor.add()" />
  </div>

  <div class="flex-col gap-md">
    @for (bonusGroup of page().bonusEditor.controls; track $index) {
      <div class="mg-surface-card flex-col gap-md p-md" [formGroup]="bonusGroup">
        <div class="mg-grid grid-cols-3 grid-cols-1-sm gap-md w-100 align-items-center">
          <label class="flex-col gap-sm">
            <span class="muted-text">Template</span>
            <p-select
              formControlName="templateId"
              [options]="page().bonusTemplateOptions()"
              optionLabel="label"
              optionValue="value"
              placeholder="Choose template"
              styleClass="w-100"
              (onChange)="page().applyTemplate($index, $event.value)"
            />
          </label>

          <label class="flex-col gap-sm">
            <span class="muted-text">Target</span>
            <input pInputText class="w-100" formControlName="target" readonly />
          </label>

          <label class="flex-col gap-sm">
            <span class="muted-text">Type</span>
            <input pInputText class="w-100" formControlName="type" readonly />
          </label>

          <label class="flex-col gap-sm">
            <span class="muted-text">Base value</span>
            <input pInputText type="number" class="w-100" formControlName="value" />
          </label>

          <label class="flex-col gap-sm grid-col-span-3">
            <span class="muted-text">Description</span>
            <input pInputText class="w-100" formControlName="description" />
          </label>
        </div>

        <div class="flex-row-start-center">
          <p-button
            label="Remove"
            severity="danger"
            [text]="true"
            (onClick)="page().bonusEditor.remove($index)"
          />
        </div>
      </div>
    } @empty {
      <p class="mb-0 muted-text">No bonuses configured yet.</p>
    }
  </div>
</div>
