<section class="mg-card flex-col gap-lg p-lg w-100">
  <div class="flex-col gap-xs">
    <p class="card-legend mb-0">Create</p>
    <h3 class="mg-section__title mg-section__title--xs mb-0">New moderation action</h3>
  </div>

  <form
    [formGroup]="page().create.createForm"
    class="flex-col gap-md"
    (ngSubmit)="createAction.emit()"
  >
    <label class="flex-col gap-sm">
      <span class="muted-text">Action type</span>
      <p-select
        class="w-100"
        formControlName="actionTypeKey"
        [options]="page().visibleActionTypes()"
        optionLabel="label"
        optionValue="key"
        (onChange)="actionTypeChange.emit()"
      />
    </label>

    @if (page().selectedActionType(); as actionType) {
      <app-metadata-display
        [label]="actionType.label"
        [description]="actionType.description"
        [helperText]="actionType.helperText"
        [technicalKey]="actionType.key"
      />
      <div class="flex-row-start-center flex-wrap gap-xs">
        @for (badge of page().actionTypeBadges(); track badge.label) {
          <span [class]="badge.className">{{ badge.label }}</span>
        }
      </div>
    }

    @if (page().selectedActionType()?.scopeRequired) {
      <label class="flex-col gap-sm">
        <span class="muted-text">Moderation scope</span>
        <p-select
          class="w-100"
          formControlName="scopeKey"
          [options]="page().scopeOptions()"
          optionLabel="label"
          optionValue="key"
        />
        @if (!page().scopeOptions().length) {
          <span class="form-error">
            No moderation scopes are available for this server context.
          </span>
        }
      </label>
    }

    <div class="mg-grid grid-cols-2 grid-cols-1-md gap-md">
      <label class="flex-col gap-sm min-w-0">
        <span class="muted-text">Target user/account</span>
        <p-autocomplete
          class="w-100"
          [fluid]="true"
          [formControl]="page().create.targets.userTargetControl"
          [suggestions]="page().create.targets.userTargetSuggestions()"
          optionLabel="label"
          [forceSelection]="true"
          [showClear]="true"
          [minLength]="2"
          [delay]="250"
          placeholder="Search account, hero or technical id"
          (completeMethod)="page().create.targets.searchUserTargets(
            $event,
            page().selectedServerId(),
            page().history.canSearchTargets()
          )"
          (onSelect)="page().create.targets.selectUserTarget($event.value)"
          (onClear)="page().create.targets.clearUserTarget()"
        />
        @if (page().create.targets.userTargetControl.value; as target) {
          <span class="muted-text">{{ target.description }}</span>
        }
        @if (
          page().create.createForm.controls.targetUserId.touched &&
          page().create.createForm.controls.targetUserId.invalid
        ) {
          <span class="form-error">Target user is required.</span>
        }
      </label>

      <label class="flex-col gap-sm min-w-0">
        <span class="muted-text">Target hero</span>
        <p-autocomplete
          class="w-100"
          [fluid]="true"
          [formControl]="page().create.targets.heroTargetControl"
          [suggestions]="page().create.targets.heroTargetSuggestions()"
          optionLabel="label"
          [forceSelection]="true"
          [showClear]="true"
          [minLength]="2"
          [delay]="250"
          placeholder="Search hero, account or technical id"
          (completeMethod)="page().create.targets.searchHeroTargets(
            $event,
            page().selectedServerId(),
            page().history.canSearchTargets()
          )"
          (onSelect)="page().create.targets.selectHeroTarget($event.value)"
          (onClear)="page().create.targets.clearHeroTarget()"
        />
        @if (page().create.targets.heroTargetControl.value; as target) {
          <span class="muted-text">{{ target.description }}</span>
        }
      </label>
    </div>

    @if (page().create.targets.message(); as message) {
      <span class="muted-text">{{ message }}</span>
    }

    <label class="flex-col gap-sm">
      <span class="muted-text">Reason</span>
      <textarea pInputText rows="3" class="w-100" formControlName="reason"></textarea>
      @if (
        page().create.createForm.controls.reason.touched &&
        page().create.createForm.controls.reason.invalid
      ) {
        <span class="form-error">Reason is required.</span>
      }
    </label>

    <label class="flex-col gap-sm">
      <span class="muted-text">Player-visible note</span>
      <textarea pInputText rows="2" class="w-100" formControlName="playerVisibleNote"></textarea>
    </label>

    <label class="flex-col gap-sm">
      <span class="muted-text">Operator notes</span>
      <textarea pInputText rows="2" class="w-100" formControlName="operatorNotes"></textarea>
    </label>

    <div class="mg-grid grid-cols-2 grid-cols-1-sm gap-md">
      <label class="flex-col gap-sm">
        <span class="muted-text">Expires at</span>
        <input pInputText class="w-100" formControlName="expiresAt" placeholder="ISO timestamp" />
      </label>

      <label class="flex-col gap-sm">
        <span class="muted-text">Source entity type</span>
        <input pInputText class="w-100" formControlName="sourceEntityType" />
      </label>

      <label class="flex-col gap-sm">
        <span class="muted-text">Source entity id</span>
        <input pInputText class="w-100" formControlName="sourceEntityId" />
      </label>

      <label class="flex-col gap-sm">
        <span class="muted-text">Source snapshot id</span>
        <input pInputText class="w-100" formControlName="sourceSnapshotId" />
      </label>
    </div>

    <div class="flex-row-start-center">
      <p-button
        type="submit"
        label="Create action"
        [loading]="page().create.isSaving()"
        [disabled]="page().create.isSaving()"
      />
    </div>
  </form>
</section>
