<div class="flex-col gap-xl">
  <app-loading-overlay
    [visible]="page.isLoading()"
    label="Loading encounter definitions"
    description="Reading encounter dictionaries, reward assignments and combat candidate configuration."
  />

  <section class="mg-card p-lg w-100">
    <app-admin-section-intro
      [legend]="page.uiMetadata.sectionLegend(page.uiMetadata.section.pageHeader)"
      [title]="page.uiMetadata.sectionTitle(page.uiMetadata.section.pageHeader)"
      [text]="page.uiMetadata.sectionText(page.uiMetadata.section.pageHeader)"
      [secondaryText]="page.uiMetadata.sectionSecondaryText(page.uiMetadata.section.pageHeader)"
    />
  </section>

  @if (page.missingUiMetadataGaps().length > 0) {
    <p-message severity="warn">
      Missing UI metadata: {{ page.missingUiMetadataGaps().join(', ') }}
    </p-message>
  }

  <section class="grid-2 gap-lg">
    <app-exploration-encounters-list-section />
    <app-exploration-encounter-meaning-section />
  </section>

  <app-exploration-encounter-edit-section />
  <app-exploration-encounter-reward-section />
  <app-exploration-encounter-combat-section />
  <app-exploration-encounter-payload-section />

  <section class="mg-card p-lg w-100">
    <app-admin-tag-links [links]="links" />
  </section>
</div>
