<div class="flex-col gap-xl">
  <app-loading-overlay
    [visible]="page.isLoading()"
    title="Loading encounter definitions"
    message="Reading encounter dictionaries, reward assignments and combat candidate configuration."
  />

  <section class="mg-card p-lg w-100">
    <div class="flex-col gap-xs">
      <p class="card-legend mb-0">Exploration encounters</p>
      <h2 class="mg-section__title mg-section__title--sm mb-0">Encounter definitions configurator</h2>
      <p class="mb-0">
        Configure exploration encounter definitions through approved admin RPCs. Combat candidates
        are editable only for combat encounters; reward assignment rows configure outcome-specific
        reward behavior.
      </p>
    </div>
  </section>

  <section class="grid-2 gap-lg">
    <app-exploration-encounters-list-section />
    <app-exploration-encounter-meaning-section />
  </section>

  <app-exploration-encounter-edit-section />
  <app-exploration-encounter-reward-section />
  <app-exploration-encounter-combat-section />
  <app-exploration-encounter-payload-section />

  <section class="mg-card p-lg w-100">
    <app-admin-tag-links [links]="links" />
  </section>
</div>
