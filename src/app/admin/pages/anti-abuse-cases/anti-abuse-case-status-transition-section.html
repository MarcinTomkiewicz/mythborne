<section class="mg-card p-lg w-100">
  <div class="flex-row-between-center flex-col-sm gap-md mb-lg">
    <div class="flex-col gap-xs min-w-0">
      <p class="card-legend mb-0">Workflow</p>
      <h3 class="mg-section__title mg-section__title--xs mb-0">Case status</h3>
      <p class="muted-text mb-0">
        Update the process status for this selected-server anti-abuse case.
      </p>
    </div>
  </div>

  @if (error(); as message) {
    <p-message severity="error">{{ message }}</p-message>
  }

  @if (successMessage(); as message) {
    <p-message severity="success">{{ message }}</p-message>
  }

  <form [formGroup]="form" class="mg-surface-card p-md flex-col gap-md" (ngSubmit)="submit()">
    <div class="mg-grid grid-cols-2 grid-cols-1-md gap-md w-100">
      <label class="flex-col gap-sm">
        <span class="muted-text">Status</span>
        <p-select
          class="w-100"
          formControlName="status"
          [options]="statusOptions"
          optionLabel="label"
          optionValue="value"
        />
      </label>

      <label class="flex-col gap-sm">
        <span class="muted-text">Status reason</span>
        <textarea
          pInputText
          rows="3"
          class="w-100"
          formControlName="statusReason"
          placeholder="Required staff reason for this transition"
        ></textarea>
      </label>
    </div>

    <div class="flex-row-end-center">
      <p-button
        type="submit"
        label="Update status"
        [loading]="isSaving()"
        [disabled]="isSaving()"
      />
    </div>
  </form>
</section>
