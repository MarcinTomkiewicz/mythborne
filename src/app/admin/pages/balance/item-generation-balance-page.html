<app-loading-overlay
  [visible]="page.isLoading() && page.loadError() === null"
  label="Loading balance data..."
  description="Loading qualities, bucket profiles and balance formulas from Supabase."
/>

@if (page.loadError()) {
  <section class="mg-card flex-col gap-sm p-lg w-100">
    <p class="card-legend mb-0">Error</p>
    <p class="mb-0 muted-text">{{ page.loadError() }}</p>
  </section>
} @else {
  <div class="flex-col gap-xl w-100">
    <section class="mg-card p-lg w-100">
      <div class="flex-row-between-center flex-col-sm gap-md">
        <div class="flex-col gap-xs">
          <p class="card-legend mb-0">Admin</p>
          <h2 class="mg-section__title mg-section__title--sm mb-0">Balance</h2>
          <p class="muted-text mb-0">
            Quality tiers, bucket profiles i globalne formulas sa edytowane bezposrednio w Supabase.
          </p>
        </div>

        <app-admin-tag-links [links]="links" />
      </div>
    </section>

    <div class="flex-col w-100 gap-xl">
      <app-quality-balance-section />
      <app-bucket-profile-balance-section />
      <app-bonus-template-balance-section />
      <app-formula-assignment-balance-section />
      <app-formula-library-balance-section />
    </div>
  </div>
}
