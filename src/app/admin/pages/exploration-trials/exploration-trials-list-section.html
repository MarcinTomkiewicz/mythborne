<article class="mg-card p-lg flex-col gap-md">
  <div class="flex-col gap-xs">
    <h3 class="mg-section__title mg-section__title--xs mb-0">Configured trials</h3>
    <p class="muted-text mb-0">
      Select a trial to inspect its gameplay meaning and any combat opponent candidates.
    </p>
  </div>
  <label class="form-field">
    <span>Trial definition</span>
    <p-select
      [formControl]="page.trialSelector"
      [options]="page.trialOptions()"
      optionLabel="label"
      optionValue="value"
    />
  </label>
  <p-table [value]="page.data()?.trials ?? []" styleClass="p-datatable-sm">
    <ng-template pTemplate="header">
      <tr>
        <th>Trial</th>
        <th>Stat</th>
        <th>Minigame</th>
        <th>Status</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-trial>
      <tr>
        <td>{{ trial.label }} <span class="muted-text">({{ trial.key }})</span></td>
        <td>{{ trial.testedStatKey }}</td>
        <td>{{ trial.minigameKey }}</td>
        <td>
          <p-tag [severity]="trial.isActive ? 'success' : 'secondary'" [value]="trial.isActive ? 'Active' : 'Inactive'" />
        </td>
      </tr>
    </ng-template>
  </p-table>
</article>
