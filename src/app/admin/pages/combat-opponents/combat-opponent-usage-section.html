<section class="mg-card p-lg w-100">
  <app-admin-section-intro
    [legend]="page.uiMetadata.sectionLegend(page.uiMetadata.section.usageCandidates)"
    [title]="page.uiMetadata.sectionTitle(page.uiMetadata.section.usageCandidates)"
    [text]="page.uiMetadata.sectionText(page.uiMetadata.section.usageCandidates)"
    [secondaryText]="page.uiMetadata.sectionSecondaryText(page.uiMetadata.section.usageCandidates)"
  />

  <p-table [value]="page.data()?.opponentViews ?? []" styleClass="p-datatable-sm mt-md">
    <ng-template pTemplate="header">
      <tr><th>Opponent</th><th>Family</th><th>Mode</th><th>Stats</th><th>Attacks</th><th>Equipment</th></tr>
    </ng-template>
    <ng-template pTemplate="body" let-view>
      <tr>
        <td>{{ view.opponent.label }}<br /><span class="muted-text">{{ view.opponent.key }}</span></td>
        <td>{{ view.familyLabel }}</td>
        <td>{{ view.equipmentModeLabel }}</td>
        <td>{{ view.statBaselines.length }}</td>
        <td>{{ view.naturalAttacks.length }}</td>
        <td>{{ view.equipmentEntries.length }}</td>
      </tr>
    </ng-template>
  </p-table>
</section>
